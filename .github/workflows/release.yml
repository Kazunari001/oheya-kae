name: Release npm package

on:
  release:
    types: [published]
  # Manual runs validate the package without publishing it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Check both the original actor and the person requesting a re-run.
    if: >-
      github.actor == 'Kazunari001' &&
      github.triggering_actor == 'Kazunari001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11 --ignore-scripts

      - name: Check release version and channel
        if: github.event_name == 'release'
        id: release
        run: node scripts/check-release.js
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome

      - name: Generate offline demo
        run: npm run demo

      - name: Test browser behavior
        run: npm run test:browser

      - name: Pack and test installed package
        id: package
        run: npm run test:package

      - name: Publish tested tarball to npm
        if: github.event_name == 'release'
        run: npm publish "$PACKAGE_TARBALL" --ignore-scripts --tag "$NPM_DIST_TAG"
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
