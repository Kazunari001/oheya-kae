name: Merge on owner approval

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: owner-approval-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      github.repository == 'Kazunari001/oheya-kae' &&
      github.event.comment.user.id == 130190029 &&
      github.event.sender.id == 130190029 &&
      startsWith(github.event.comment.body, '/merge ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Read trusted workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/merge-approved-pr.js
          sparse-checkout-cone-mode: false
      - name: Merge the approved commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --input-type=module < scripts/merge-approved-pr.js
