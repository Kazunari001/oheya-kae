name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Install Google Chrome
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chrome

      # The Windows and macOS hosted images already contain Google Chrome.
      - name: Generate offline demo
        run: npm run demo

      - name: Test offline viewer in Google Chrome
        run: npm run test:browser

      - name: Pack and test installed package
        run: npm run test:package
